<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ai Là Triệu Phú - Đoạn Mạch Nối Tiếp</title>
    <style>
        :root {
            --bg-dark: #05081a;
            --bg-panel: #0d153b;
            --border-gold: #f5b041;
            --border-blue: #3498db;
            --accent-orange: #e67e22;
            --correct-green: #27ae60;
            --wrong-red: #c0392b;
            --text-light: #ffffff;
            --text-muted: #a8b8d8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #13215e 0%, var(--bg-dark) 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(13, 21, 59, 0.94);
            border: 2px solid var(--border-blue);
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(52, 152, 219, 0.45);
            padding: 22px;
            position: relative;
        }

        .screen {
            display: none;
            animation: fadeIn 0.35s ease-in-out;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Màn hình bắt đầu */
        .logo-box {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo-circle {
            width: 100px;
            height: 100px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: radial-gradient(circle, #2980b9, #091030);
            border: 4px solid var(--border-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 0 25px rgba(245, 176, 65, 0.6);
        }
        h1 {
            font-size: 1.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--border-gold);
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 6px;
        }

        .form-group {
            max-width: 420px;
            margin: 0 auto 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #d6e4ff;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid var(--border-blue);
            background: #060a21;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.25s;
        }
        .form-group input:focus {
            border-color: var(--border-gold);
        }

        .btn-primary {
            display: block;
            width: 100%;
            max-width: 420px;
            margin: 24px auto 0;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: white;
            font-size: 1.15rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(243, 156, 18, 0.6);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Màn hình chơi game */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            margin-bottom: 18px;
        }
        .player-badge {
            background: rgba(52, 152, 219, 0.2);
            border: 1px solid var(--border-blue);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.92rem;
        }
        .stats-bar {
            display: flex;
            gap: 12px;
            font-weight: bold;
        }
        .stat-item {
            background: #060a21;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-gold);
            color: var(--border-gold);
            font-size: 0.95rem;
        }

        .game-layout {
            display: grid;
            grid-template-columns: 1fr 225px;
            gap: 18px;
        }

        /* Quyền trợ giúp */
        .lifelines {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .lifeline-btn {
            background: linear-gradient(180deg, #1f3a93, #0d1b4c);
            border: 2px solid var(--border-blue);
            color: white;
            padding: 8px 15px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.88rem;
            transition: all 0.2s;
        }
        .lifeline-btn:hover:not(:disabled) {
            border-color: var(--border-gold);
            transform: scale(1.04);
        }
        .lifeline-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        /* Hộp câu hỏi */
        .question-box {
            background: linear-gradient(180deg, #101d54 0%, #091033 100%);
            border: 2px solid var(--border-gold);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            min-height: 125px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
            box-shadow: inset 0 0 15px rgba(245, 176, 65, 0.2);
        }
        .q-number {
            color: var(--border-gold);
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .q-text {
            font-size: 1.1rem;
            line-height: 1.5;
            font-weight: 500;
        }
        .diagram-box {
            margin-top: 14px;
            background: #ffffff;
            padding: 10px 16px;
            border-radius: 10px;
            border: 2px solid var(--border-blue);
            max-width: 100%;
        }

        /* Lưới đáp án */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .option-btn {
            background: linear-gradient(90deg, #0c1747, #162875, #0c1747);
            border: 2px solid var(--border-blue);
            border-radius: 28px;
            padding: 13px 18px;
            color: white;
            font-size: 0.98rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.35;
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--border-gold);
            background: linear-gradient(90deg, #162875, #233ea8, #162875);
        }
        .option-btn .prefix {
            color: var(--border-gold);
            font-weight: bold;
            flex-shrink: 0;
        }
        .option-btn.selected {
            background: var(--accent-orange);
            border-color: #fff;
        }
        .option-btn.correct {
            background: var(--correct-green) !important;
            border-color: #fff !important;
            animation: pulse 0.45s;
        }
        .option-btn.wrong {
            background: var(--wrong-red) !important;
            border-color: #fff !important;
        }
        .option-btn.hidden-opt {
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Thang điểm bên phải (20 câu) */
        .ladder-panel {
            background: #060a21;
            border: 1px solid rgba(52, 152, 219, 0.4);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column-reverse;
            justify-content: space-between;
        }
        .ladder-step {
            padding: 3px 9px;
            border-radius: 5px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }
        .ladder-step.milestone {
            color: #fff;
            font-weight: bold;
        }
        .ladder-step.active {
            background: var(--accent-orange);
            color: #fff;
            font-weight: bold;
        }
        .ladder-step.passed {
            color: var(--correct-green);
        }

        /* Hộp thoại trợ giúp */
        .helper-modal {
            margin-top: 14px;
            background: rgba(6, 10, 33, 0.96);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 14px;
            display: none;
            font-size: 0.94rem;
            line-height: 1.5;
        }
        .audience-bars {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 85px;
            margin-top: 8px;
            padding-top: 8px;
        }
        .bar-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45px;
        }
        .bar-fill {
            width: 26px;
            background: var(--border-gold);
            border-radius: 4px 4px 0 0;
            transition: height 0.4s;
        }

        /* Màn hình kết thúc */
        .result-card {
            text-align: center;
            padding: 15px 10px;
        }
        .result-score {
            font-size: 2.8rem;
            font-weight: bold;
            color: var(--border-gold);
            margin: 12px 0;
        }
        .result-details {
            background: #060a21;
            max-width: 460px;
            margin: 0 auto 20px;
            padding: 18px;
            border-radius: 14px;
            border: 1px solid var(--border-blue);
            text-align: left;
            line-height: 1.85;
        }
        .sync-status {
            font-size: 0.9rem;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(39, 174, 96, 0.15);
            color: #2ecc71;
            text-align: center;
        }

        /* Responsive cho điện thoại */
        @media (max-width: 820px) {
            .game-layout {
                grid-template-columns: 1fr;
            }
            .ladder-panel {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 4px;
                justify-content: center;
            }
            .ladder-step {
                font-size: 0.72rem;
                padding: 2px 6px;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
            h1 { font-size: 1.35rem; }
            .container { padding: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- MÀN HÌNH 1: BẮT ĐẦU -->
    <div id="start-screen" class="screen active">
        <div class="logo-box">
            <div class="logo-circle">⚡</div>
            <h1>Ai Là Triệu Phú</h1>
            <p class="subtitle">Bài 4: Đoạn Mạch Nối Tiếp — Vật Lý 9 / KHTN 9</p>
        </div>

        <div class="form-group">
            <label for="player-name">Họ và tên học sinh *</label>
            <input type="text" id="player-name" placeholder="Nhập họ và tên của bạn..." required>
        </div>

        <div class="form-group">
            <label for="player-group">Lớp / Nhóm *</label>
            <input type="text" id="player-group" placeholder="Ví dụ: Lớp 9/1 - Nhóm 2" required>
        </div>

        <button class="btn-primary" onclick="startGame()">Bắt đầu chơi</button>
    </div>

    <!-- MÀN HÌNH 2: CHƠI GAME -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="player-badge" id="display-player">Thí sinh: ---</div>
            <div class="stats-bar">
                <div class="stat-item">⏱ <span id="timer-display">0</span>s</div>
                <div class="stat-item">🏆 <span id="score-display">0</span> điểm</div>
            </div>
        </div>

        <div class="game-layout">
            <div class="main-play-area">
                <div class="lifelines">
                    <button class="lifeline-btn" id="life-5050" onclick="use5050()">50:50</button>
                    <button class="lifeline-btn" id="life-audience" onclick="useAudience()">📊 Khán giả</button>
                    <button class="lifeline-btn" id="life-phone" onclick="usePhone()">📞 Gọi chuyên gia</button>
                </div>

                <div class="question-box">
                    <div class="q-number" id="q-number">Câu hỏi 1 / 20</div>
                    <div class="q-text" id="q-text">Đang tải câu hỏi...</div>
                    <div id="q-diagram"></div>
                </div>

                <div class="options-grid" id="options-grid"></div>

                <div class="helper-modal" id="helper-modal"></div>
            </div>

            <div class="ladder-panel" id="ladder-panel"></div>
        </div>
    </div>

    <!-- MÀN HÌNH 3: TỔNG KẾT -->
    <div id="end-screen" class="screen">
        <div class="result-card">
            <div class="logo-circle" id="end-icon">🎉</div>
            <h1 id="end-title">Hoàn Thành Thử Thách!</h1>
            <div class="result-score"><span id="final-score">0</span> điểm</div>

            <div class="result-details">
                <div>👤 <strong>Họ và tên:</strong> <span id="res-name"></span></div>
                <div>🏫 <strong>Lớp / Nhóm:</strong> <span id="res-group"></span></div>
                <div>✅ <strong>Số câu trả lời đúng:</strong> <span id="res-correct"></span> / 20</div>
                <div>⏱ <strong>Thời gian hoàn thành:</strong> <span id="res-duration"></span> giây</div>
                <div class="sync-status" id="sync-status">⏳ Đang đồng bộ dữ liệu...</div>
            </div>

            <button class="btn-primary" onclick="resetGame()">Chơi lại</button>
        </div>
    </div>
</div>

    // Thang điểm 20 câu (mỗi câu 10 điểm, tối đa 200 điểm)
    const SCORE_LADDER = Array.from({ length: QUESTIONS.length }, (_, i) => (i + 1) * 10);

    // =========================================================================
    // 2. HỆ THỐNG ÂM THANH TỔNG HỢP (WEB AUDIO API)
    // =========================================================================
    const AudioEngine = {
        ctx: null,
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        },
        playTone(freq, type, duration, delay = 0, vol = 0.2) {
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + delay);
            osc.stop(this.ctx.currentTime + delay + duration);
        },
        soundStart() {
            [261.63, 329.63, 392.00, 523.25].forEach((f, i) => this.playTone(f, 'triangle', 0.28, i * 0.09, 0.25));
        },
        soundSelect() {
            this.playTone(440, 'sine', 0.14, 0, 0.2);
        },
        soundCorrect() {
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => this.playTone(f, 'sine', 0.22, i * 0.07, 0.25));
        },
        soundWrong() {
            this.playTone(220, 'sawtooth', 0.35, 0, 0.25);
            this.playTone(164.81, 'sawtooth', 0.5, 0.18, 0.25);
        },
        soundLifeline() {
            this.playTone(587.33, 'triangle', 0.15, 0, 0.2);
            this.playTone(880, 'triangle', 0.25, 0.12, 0.2);
        }
    };

    // =========================================================================
    // 3. TRẠNG THÁI & LOGIC TRÒ CHƠI
    // =========================================================================
    let state = {
        name: "",
        group: "",
        currentIndex: 0,
        score: 0,
        correctCount: 0,
        startTime: 0,
        duration: 0,
        timerInterval: null,
        isLocked: false,
        lifelines: { fifty: false, audience: false, phone: false }
    };

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startGame() {
        const nameInput = document.getElementById('player-name').value.trim();
        const groupInput = document.getElementById('player-group').value.trim();

        if (!nameInput || !groupInput) {
            alert("Vui lòng nhập đầy đủ Họ và tên và Lớp/Nhóm trước khi bắt đầu!");
            return;
        }

        AudioEngine.soundStart();

        state = {
            name: nameInput,
            group: groupInput,
            currentIndex: 0,
            score: 0,
            correctCount: 0,
            startTime: Date.now(),
            duration: 0,
            timerInterval: null,
            isLocked: false,
            lifelines: { fifty: false, audience: false, phone: false }
        };

        document.getElementById('display-player').textContent = `👤 ${state.name} (${state.group})`;
        document.getElementById('score-display').textContent = "0";
        document.getElementById('timer-display').textContent = "0";

        document.getElementById('life-5050').disabled = false;
        document.getElementById('life-audience').disabled = false;
        document.getElementById('life-phone').disabled = false;

        state.timerInterval = setInterval(() => {
            state.duration = Math.floor((Date.now() - state.startTime) / 1000);
            document.getElementById('timer-display').textContent = state.duration;
        }, 1000);

        buildLadder();
        loadQuestion();
        showScreen('game-screen');
    }

    function buildLadder() {
        const ladder = document.getElementById('ladder-panel');
        ladder.innerHTML = "";
        SCORE_LADDER.forEach((pts, idx) => {
            const div = document.createElement('div');
            div.className = 'ladder-step' + ((idx + 1) % 5 === 0 ? ' milestone' : '');
            div.id = `step-${idx}`;
            div.innerHTML = `<span>Câu ${idx + 1}</span><span>${pts} đ</span>`;
            ladder.appendChild(div);
        });
    }

    function updateLadder() {
        SCORE_LADDER.forEach((_, idx) => {
            const el = document.getElementById(`step-${idx}`);
            el.classList.remove('active', 'passed');
            if (idx < state.currentIndex) el.classList.add('passed');
            if (idx === state.currentIndex) el.classList.add('active');
        });
    }

    function loadQuestion() {
        state.isLocked = false;
        const helper = document.getElementById('helper-modal');
        helper.style.display = 'none';
        helper.innerHTML = '';

        const qObj = QUESTIONS[state.currentIndex];
        document.getElementById('q-number').textContent = `Câu hỏi ${state.currentIndex + 1} / ${QUESTIONS.length}`;
        document.getElementById('q-text').textContent = qObj.q;
        document.getElementById('q-diagram').innerHTML = qObj.diagram || '';

        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];

        qObj.options.forEach((optText, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.id = `opt-${idx}`;
            btn.innerHTML = `<span class="prefix">${letters[idx]}:</span> <span>${optText}</span>`;
            btn.onclick = () => handleAnswer(idx);
            grid.appendChild(btn);
        });

        updateLadder();
    }

    function handleAnswer(selectedIdx) {
        if (state.isLocked) return;
        state.isLocked = true;
        AudioEngine.soundSelect();

        const qObj = QUESTIONS[state.currentIndex];
        const selectedBtn = document.getElementById(`opt-${selectedIdx}`);
        selectedBtn.classList.add('selected');

        setTimeout(() => {
            selectedBtn.classList.remove('selected');
            const correctBtn = document.getElementById(`opt-${qObj.answer}`);

            if (selectedIdx === qObj.answer) {
                selectedBtn.classList.add('correct');
                AudioEngine.soundCorrect();
                state.correctCount++;
                state.score = SCORE_LADDER[state.currentIndex];
                document.getElementById('score-display').textContent = state.score;

                setTimeout(() => {
                    state.currentIndex++;
                    if (state.currentIndex < QUESTIONS.length) {
                        loadQuestion();
                    } else {
                        endGame(true);
                    }
                }, 1050);
            } else {
                selectedBtn.classList.add('wrong');
                correctBtn.classList.add('correct');
                AudioEngine.soundWrong();

                setTimeout(() => {
                    endGame(false);
                }, 1450);
            }
        }, 750);
    }

    // =========================================================================
    // 4. QUYỀN TRỢ GIÚP
    // =========================================================================
    function use5050() {
        if (state.lifelines.fifty || state.isLocked) return;
        state.lifelines.fifty = true;
        document.getElementById('life-5050').disabled = true;
        AudioEngine.soundLifeline();

        const correctIdx = QUESTIONS[state.currentIndex].answer;
        let wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIdx);
        wrongIndices.sort(() => Math.random() - 0.5);
        document.getElementById(`opt-${wrongIndices[0]}`).classList.add('hidden-opt');
        document.getElementById(`opt-${wrongIndices[1]}`).classList.add('hidden-opt');
    }

    function useAudience() {
        if (state.lifelines.audience || state.isLocked) return;
        state.lifelines.audience = true;
        document.getElementById('life-audience').disabled = true;
        AudioEngine.soundLifeline();

        const correctIdx = QUESTIONS[state.currentIndex].answer;
        let percents = [0, 0, 0, 0];
        let remaining = 100;

        percents[correctIdx] = Math.floor(Math.random() * 21) + 55;
        remaining -= percents[correctIdx];

        const otherIndices = [0, 1, 2, 3].filter(i => i !== correctIdx);
        otherIndices.forEach((idx, pos) => {
            if (pos === otherIndices.length - 1) {
                percents[idx] = remaining;
            } else {
                const val = Math.floor(Math.random() * (remaining + 1));
                percents[idx] = val;
                remaining -= val;
            }
        });

        const letters = ['A', 'B', 'C', 'D'];
        const modal = document.getElementById('helper-modal');
        modal.style.display = 'block';
        modal.innerHTML = `<strong>📊 Kết quả khảo sát khán giả trường quay:</strong>
            <div class="audience-bars">
                ${letters.map((l, i) => `
                    <div class="bar-col">
                        <span>${percents[i]}%</span>
                        <div class="bar-fill" style="height: ${Math.max(percents[i] * 0.7, 5)}px"></div>
                        <strong>${l}</strong>
                    </div>
                `).join('')}
            </div>`;
    }

    function usePhone() {
        if (state.lifelines.phone || state.isLocked) return;
        state.lifelines.phone = true;
        document.getElementById('life-phone').disabled = true;
        AudioEngine.soundLifeline();

        const qObj = QUESTIONS[state.currentIndex];
        const letters = ['A', 'B', 'C', 'D'];
        const modal = document.getElementById('helper-modal');
        modal.style.display = 'block';
        modal.innerHTML = `<strong>📞 Chuyên gia Vật lý gợi ý:</strong><br>
            "Hướng dẫn giải: <em>${qObj.hint}</em> Vì vậy đáp án chính xác là <strong>${letters[qObj.answer]}</strong>!"`;
    }

    // =========================================================================
    // 5. KẾT THÚC & GỬI DỮ LIỆU NGẦM VỀ GOOGLE APPS SCRIPT
    // =========================================================================
    function endGame(isWinner) {
        clearInterval(state.timerInterval);
        state.duration = Math.max(1, Math.floor((Date.now() - state.startTime) / 1000));

        document.getElementById('end-icon').textContent = isWinner ? "👑" : "🎯";
        document.getElementById('end-title').textContent = isWinner ? "Chúc Mừng Nhà Vô Địch!" : "Trò Chơi Kết Thúc!";
        document.getElementById('final-score').textContent = state.score;
        document.getElementById('res-name').textContent = state.name;
        document.getElementById('res-group').textContent = state.group;
        document.getElementById('res-correct').textContent = state.correctCount;
        document.getElementById('res-duration').textContent = state.duration;

        showScreen('end-screen');
        sendDataToSheet();
    }

    function sendDataToSheet() {
        const statusEl = document.getElementById('sync-status');
        statusEl.textContent = "⏳ Đang gửi kết quả về bảng điểm...";
        statusEl.style.color = "#f39c12";

        const payload = {
            name: state.name,
            group: state.group,
            score: state.score,
            duration: state.duration
        };

        fetch(WEBHOOK_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusEl.textContent = "✅ Đã lưu kết quả thành công lên hệ thống!";
            statusEl.style.color = "#2ecc71";
        })
        .catch((err) => {
            console.error("Lỗi gửi dữ liệu:", err);
            statusEl.textContent = "⚠️ Không thể kết nối máy chủ, vui lòng chụp màn hình kết quả.";
            statusEl.style.color = "#e74c3c";
        });
    }

    function resetGame() {
        showScreen('start-screen');
    }
</script>
